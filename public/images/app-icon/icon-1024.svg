  <!-- Center circle -->
  <circle cx="512" cy="512" r="196.8" fill="white" />

  <!-- Percentage text -->
  <text x="512" y="512"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="153.6"
        font-weight="600"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#0071e3">75%</text>

  <!-- PREVIEW watermark -->
  <text x="512" y="994"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="16"
        font-weight="500"
        text-anchor="middle"
        fill="#86868b"
        opacity="0.5">PREVIEW</text>
</svg>