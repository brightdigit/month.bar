<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8ed;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Icon (centered, 200x200) -->
  <g transform="translate(500, 165)">
    <circle cx="100" cy="100" r="90" fill="#f5f5f7" />
    <path d="M 100 100 L 100 10 A 90 90 0 1 1 36.967 163.033 Z" fill="#0071e3" />
    <circle cx="100" cy="100" r="36" fill="white" />
    <text x="100" y="100"
          font-family="-apple-system, BlinkMacSystemFont, sans-serif"
          font-size="30"
          font-weight="600"
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#0071e3">75%</text>
  </g>

  <!-- Title -->
  <text x="600" y="415"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="64"
        font-weight="700"
        text-anchor="middle"
        fill="#1d1d1f">MonthBar</text>

  <!-- Subtitle -->
  <text x="600" y="475"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="32"
        font-weight="400"
        text-anchor="middle"
        fill="#6e6e73">Track your month's progress</text>

  <!-- PREVIEW watermark -->
  <text x="1100" y="600"
        font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="24"
        font-weight="500"
        text-anchor="end"
        fill="#86868b"
        opacity="0.5">PREVIEW</text>
</svg>